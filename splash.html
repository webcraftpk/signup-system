<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .splash {
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            background: #1a73e8;
            color: white;
            font-size: 55px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(26, 115, 232, 0.25);
            animation: logoAnimation 1.5s ease infinite alternate;
        }

        h1 {
            margin-top: 25px;
            color: #202124;
            font-size: 28px;
            font-weight: 500;
        }

        p {
            margin-top: 8px;
            color: #5f6368;
            font-size: 14px;
        }

        .loader {
            width: 35px;
            height: 35px;
            margin: 25px auto 0;
            border: 3px solid #e8eaed;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes logoAnimation {
            from {
                transform: scale(0.95);
            }

            to {
                transform: scale(1.05);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="splash">

        <div class="logo">S</div>

        <h1>Signup System</h1>

        <p>Welcome</p>

        <div class="loader"></div>

    </div>

    <script>
        setTimeout(function () {
            window.location.href = "index.html";
        }, 3000);
    </script>

</body>
</html>
